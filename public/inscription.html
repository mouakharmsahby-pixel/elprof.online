<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscription | EL PROF</title>
  <meta name="description" content="Crée ton compte EL PROF et commence ton parcours de français.">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/auth-premium.css">
</head>
<body>
  <header class="site-header"><div class="container header-inner"><a class="brand" href="/" aria-label="EL PROF - Accueil"><img src="/logo.png" alt="Logo EL PROF" class="brand-logo"><span>EL <strong>PROF</strong></span></a><nav class="main-nav" aria-label="Navigation principale"><a href="/#cours">Cours</a><a href="/#niveaux">Niveaux</a><a href="/#offres">Offres</a><a href="/#temoignages">Avis</a><a href="/connexion.html">Connexion</a></nav><button class="menu-toggle" id="menuToggle" aria-label="Ouvrir le menu" aria-expanded="false">☰</button></div><nav class="mobile-nav" id="mobileNav"><a href="/#cours">Cours</a><a href="/#niveaux">Niveaux</a><a href="/#offres">Offres</a><a href="/#temoignages">Avis</a><a href="/connexion.html">Connexion</a></nav></header>
  <main class="auth-shell"><div class="auth-box"><div class="auth-top"><img src="/logo.png" alt="Logo EL PROF" class="auth-logo"><span class="auth-badge">Inscription</span><h1>Crée ton compte</h1><p>Rejoins EL PROF et commence ton parcours de français.</p></div>
    <form class="auth-form" action="/api/auth/register" method="post"><div class="field"><label for="fullName">Nom complet</label><input id="fullName" name="fullName" type="text" placeholder="Votre nom complet" autocomplete="name" required></div><div class="field"><label for="studentLevel">Niveau scolaire</label><select id="studentLevel" name="studentLevel"><option>7ème</option><option>8ème</option><option>9ème</option><option>1ère</option><option>2ème</option><option>3ème</option><option>Bac</option></select></div><div class="field"><label for="email">Adresse e-mail</label><input id="email" name="email" type="email" placeholder="exemple@email.com" autocomplete="email" required></div><div class="field"><label for="password">Mot de passe</label><input id="password" name="password" type="password" placeholder="********" autocomplete="new-password" minlength="8" required></div><div class="field"><label for="passwordConfirm">Confirmer le mot de passe</label><input id="passwordConfirm" name="passwordConfirm" type="password" placeholder="********" autocomplete="new-password" minlength="8" required></div><div class="inline-row"><label class="checkbox"><input type="checkbox" name="terms" required><span>J'accepte les conditions</span></label></div><div class="auth-actions"><button class="button button-yellow full" type="submit">Créer mon compte</button></div></form>
    <div class="auth-footer">Déjà inscrit ? <a href="/connexion.html">Se connecter</a></div>
  </div></main>
  <footer class="footer"><div class="container footer-inner"><a class="brand" href="/"><img src="/logo.png" alt="Logo EL PROF" class="footer-logo"><span>EL <strong>PROF</strong></span></a><p>© 2026 EL PROF — Cours particuliers en français.</p><div><a href="/connexion.html">Connexion</a> · <a href="/inscription.html">Inscription</a></div></div></footer>
  <script src="/auth-client.js" defer></script><script>const toggle=document.getElementById('menuToggle'),nav=document.getElementById('mobileNav');toggle.addEventListener('click',()=>{const open=nav.classList.toggle('open');toggle.setAttribute('aria-expanded',String(open));});nav.querySelectorAll('a').forEach(link=>link.addEventListener('click',()=>nav.classList.remove('open')));</script>
</body>
</html>
